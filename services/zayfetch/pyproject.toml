[project]
name = "zayfetch"
version = "0.1.0"
description = "ZayMusic acquisition service — YouTube/YT Music search + download pipeline"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "mutagen>=1.48.1",
    "ytmusicapi>=1.12.3",
    # [default] pulls yt-dlp-ejs: the JS challenge solver scripts that solve
    # YouTube's "n" signature (pip installs don't bundle them, and without
    # them gated/premium tracks extract no audio formats).
    "yt-dlp[default]==2026.10.26",
    "curl_cffi>=0.17.0",
    "musicbrainzngs>=0.7.1",
    # PO Token provider plugin: authenticated YouTube sessions need a
    # video-bound token or yt-dlp only sees SABR-only formats.
    "bgutil-ytdlp-pot-provider>=2.0.2",
    # CDP client for the managed browser session (connect_over_cdp only —
    # the browser lives in its own container, so we never playwright install).
    "playwright>=1.64.1",
    # TOTP generation for the automated Google re-login (GOOGLE_TOTP_SECRET).
    "pyotp>=2.10.0",
    "r128gain>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zayfetch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[package]
name = "zay-gateway"
version.workspace = true
edition.workspace = true
description = "Credential-injecting HTTP gateway between native clients and the ZayMusic services"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

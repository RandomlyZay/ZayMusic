[package]
name = "zay-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
uniffi = { version = "0.32.2" }
thiserror = "2.0.21"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]
path = "src/bin.rs"

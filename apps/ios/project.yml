name: ZayMusic
options:
  bundleIdPrefix: io.zaymusic
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    OTHER_LDFLAGS: ['-lz', '-lsqlite3', '-framework', 'Security', '-framework', 'SystemConfiguration']
targets:
  ZayMusic:
    type: application
    platform: iOS
    sources: [ZayMusic, Generated/zay_core.swift]
    dependencies:
      - framework: Frameworks/ZayCore.xcframework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ZayMusic
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  ZayMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZayMusicTests]
    dependencies:
      - target: ZayMusic
  ZayMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ZayMusicUITests]
    dependencies:
      - target: ZayMusic
schemes:
  ZayMusic:
    build:
      targets:
        ZayMusic: all
    test:
      targets: [ZayMusicTests, ZayMusicUITests]
